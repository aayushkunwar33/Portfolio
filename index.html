   <p id="text" style="color: white; font-size: 18px; text-align: center; margin-top: 20px;">
      I am the first mate of the Straw Hat Pirates,
  </p>

<script>
  const words = [ "I am the first mate of the Straw Hat Pirates.",
                  "I am going to be the greatest swordsman in the world."];
  let index = 0;

  const textElement = document.getElementById("text");

  setInterval(() => {
    textElement.textContent = words[index];
    
    index++;

    if (index >= words.length) {
      index = 0; // restart from beginning
    }
  }, 2000); // 1000ms = 1 second
</script>
